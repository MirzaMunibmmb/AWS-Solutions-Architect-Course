tasks:
  - name: aws-cli
    before: |
      cd /workspace
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      sudo ./aws/install

      # Automatically configure AWS CLI using env vars
      aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
      aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
      aws configure set default.region ${AWS_DEFAULT_REGION:-us-east-1}
      aws configure set output json

      aws sts get-caller-identity # Optional: Check if AWS CLI is configured correctly

      cd $THEIA_WORKSPACE_ROOT

# Set env variables globally
env:
  AWS_CLI_AUTO_PROMPT: on
